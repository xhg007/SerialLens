<?xml version="1.0" standalone="no"?>
<svg width="512" height="512" viewBox="6 6 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主背景渐变：深蓝科技感 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    
    <!-- 波形渐变 -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    
    <!-- 中央芯片渐变 -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    
    <!-- 光泽高光 -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    
    <!-- 圆角矩形裁剪 -->
    <clipPath id="iconClip">
      <rect x="16" y="16" width="480" height="480" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- 背景圆角矩形 -->
  <g clip-path="url(#iconClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#bgGrad)"/>
    
    <!-- 顶部高光 -->
    <rect x="16" y="16" width="480" height="240" fill="url(#glossGrad)"/>
    
    <!-- 背景电路纹理 -->
    <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" fill="none">
      <path d="M 60 400 h 80 l 30 -30 h 60"/>
      <path d="M 60 440 h 110 l 25 -25 h 50"/>
      <path d="M 460 380 h -70 l -25 25 h -45"/>
      <circle cx="270" cy="370" r="6"/>
      <circle cx="310" cy="405" r="6"/>
      <circle cx="52" cy="400" r="6"/>
    </g>

    <!-- 网格点阵装饰 -->
    <g fill="#ffffff" fill-opacity="0.12">
      <circle cx="90" cy="100" r="3"/>
      <circle cx="120" cy="100" r="3"/>
      <circle cx="150" cy="100" r="3"/>
      <circle cx="90" cy="130" r="3"/>
      <circle cx="120" cy="130" r="3"/>
      <circle cx="150" cy="130" r="3"/>
      <circle cx="380" cy="420" r="3"/>
      <circle cx="410" cy="420" r="3"/>
      <circle cx="440" cy="420" r="3"/>
      <circle cx="380" cy="450" r="3"/>
      <circle cx="410" cy="450" r="3"/>
    </g>

    <!-- ===== 中央串口连接器 (DB9 风格) ===== -->
    <g transform="translate(256, 215)">
      <!-- 连接器外框 -->
      <rect x="-105" y="-65" width="210" height="130" rx="22" fill="#0f172a" stroke="#22d3ee" stroke-width="5"/>
      <!-- 固定螺丝孔 -->
      <circle cx="-92" cy="0" r="12" fill="none" stroke="#64748b" stroke-width="5"/>
      <circle cx="92" cy="0" r="12" fill="none" stroke="#64748b" stroke-width="5"/>
      <!-- 引脚 -->
      <g fill="#fbbf24">
        <circle cx="-60" cy="-25" r="9"/>
        <circle cx="-30" cy="-25" r="9"/>
        <circle cx="0" cy="-25" r="9"/>
        <circle cx="30" cy="-25" r="9"/>
        <circle cx="60" cy="-25" r="9"/>
        <circle cx="-45" cy="25" r="9"/>
        <circle cx="-15" cy="25" r="9"/>
        <circle cx="15" cy="25" r="9"/>
        <circle cx="45" cy="25" r="9"/>
      </g>
    </g>

    <!-- ===== TX 信号波形（方波 - 串口数据特征） ===== -->
    <path d="M 50 300 &#10;             h 25 v -25 h 25 v 25 h 25 v -25 h 25 v 25 h 25 &#10;             h 22" fill="none" stroke="url(#waveGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- ===== RX 信号波形 ===== -->
    <path d="M 290 340 h 20 v -22 h 22 v 22 h 22 v -22 h 22 v 22 h 20 h 20" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- ===== 智能芯片（AI 元素） ===== -->
    <g transform="translate(256, 130)">
      <!-- 芯片主体 -->
      <rect x="-38" y="-38" width="76" height="76" rx="14" fill="url(#chipGrad)"/>
      <!-- 芯片内芯 -->
      <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#78350f" opacity="0.85"/>
      <!-- 芯片引脚 -->
      <g stroke="#fbbf24" stroke-width="6" stroke-linecap="round">
        <line x1="-20" y1="-48" x2="-20" y2="-38"/>
        <line x1="0" y1="-48" x2="0" y2="-38"/>
        <line x1="20" y1="-48" x2="20" y2="-38"/>
        <line x1="-20" y1="38" x2="-20" y2="48"/>
        <line x1="0" y1="38" x2="0" y2="48"/>
        <line x1="20" y1="38" x2="20" y2="48"/>
        <line x1="-48" y1="-20" x2="-38" y2="-20"/>
        <line x1="-48" y1="0" x2="-38" y2="0"/>
        <line x1="-48" y1="20" x2="-38" y2="20"/>
        <line x1="38" y1="-20" x2="48" y2="-20"/>
        <line x1="38" y1="0" x2="48" y2="0"/>
        <line x1="38" y1="20" x2="48" y2="20"/>
      </g>
      <!-- AI 神经网络点 -->
      <g fill="#fde68a">
        <circle cx="-9" cy="-9" r="4.5"/>
        <circle cx="9" cy="-9" r="4.5"/>
        <circle cx="0" cy="0" r="4.5"/>
        <circle cx="-9" cy="9" r="4.5"/>
        <circle cx="9" cy="9" r="4.5"/>
      </g>
      <g stroke="#fde68a" stroke-width="2" opacity="0.8">
        <line x1="-9" y1="-9" x2="0" y2="0"/>
        <line x1="9" y1="-9" x2="0" y2="0"/>
        <line x1="-9" y1="9" x2="0" y2="0"/>
        <line x1="9" y1="9" x2="0" y2="0"/>
      </g>
    </g>

    <!-- 信号指示灯 -->
    <circle cx="120" cy="200" r="8" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="230" r="8" fill="#fbbf24">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 图标外描边 -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>
</svg>